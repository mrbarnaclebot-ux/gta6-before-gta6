<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vice Demo</title>
  </head>
  <body>
    <canvas id="view" tabindex="0"></canvas>
    <section id="title" class="title">
      <div class="title-card">
        <p class="kicker">An open-world browser demo</p>
        <h1>Vice<span>Demo</span></h1>
        <button id="play" type="button">Play</button>
        <p id="status" class="status" role="status"></p>
        <p class="controls">
          WASD move &middot; Shift run &middot; Space jump or surface &middot; Ctrl or C dive
          &middot; F get in or out of a car &middot; Space handbrake &middot; Mouse look &middot;
          Esc release mouse
        </p>
      </div>
      <footer class="title-foot">
        <a href="/terms.html">Terms</a>
        <span>Desktop with keyboard and mouse recommended</span>
      </footer>
    </section>
    <div id="hud" class="hud" hidden>
      <span id="fps" class="fps" hidden></span>
      <button id="quality" type="button" class="quality"></button>
    </div>
    <div id="underwater" class="underwater" hidden></div>
    <p id="prompt" class="prompt" hidden><kbd>F</kbd> <span></span></p>
    <div id="speedo" class="speedo" hidden>
      <span id="speed" class="speed-value">0</span>
      <span class="speed-unit">km/h</span>
      <span id="stall" class="stall" hidden>Engine flooded</span>
    </div>
    <div id="crosshair" class="crosshair" hidden>
      <span class="hitmark" id="hitmark" hidden></span>
    </div>
    <div id="ammo" class="ammo" hidden>
      <span id="mag" class="mag">12</span>
      <span id="reserve" class="reserve">96</span>
      <span id="reloading" class="reloading" hidden>Reloading</span>
    </div>
    <div class="vitals">
      <div id="health" class="bar health" role="meter" aria-label="Health" hidden>
        <span></span>
      </div>
      <div id="breath" class="bar breath" role="meter" aria-label="Breath" hidden>
        <span></span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      # SwiftShader on a 2-core runner draws well under 1 fps, so CI runs one boot-and-walk
      # test on Low; the full suite (swim, drive, shoot, life) runs locally with `pnpm test:e2e`.
      - run: pnpm test:e2e --grep @smoke
        timeout-minutes: 10
      - uses: actions/upload-artifact@v7
        if: failure() || cancelled()
        with:
          name: test-results
          path: test-results/
          retention-days: 7
